name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build & checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:unit
      # Registry check: builds the real MCP server and lists its tools, so a
      # duplicate/invalid tool registration (which takes the server down at
      # startup) fails CI instead of shipping.
      - run: npm run test:tools

# Note: `npm test` (test/smoke.ts) is a LIVE smoke test that needs a logged-in
# browser session and a display, so it is not run in CI — run it locally after
# `npm run login`. `npm run test:unit` (test/unit.ts) and `npm run test:tools`
# (test/tools.ts) are both offline and run above.
